[project]
name = "khuda-quant"
version = "0.1.0"
description = "quant project for KHUDA finance track"
readme = "README.md"
authors = [
    { name = "Halofty"}
]
requires-python = ">=3.12"
dependencies = [
    "bt>=1.4.1",
    "finance-datareader>=0.9.202",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pycryptodome>=4.5.0",
    "pykrx>=1.0.51",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "setuptools<81",  # pykrx 1.0.51이 pkg_resources를 import한다 (setuptools 81 이상에서 제거됨)
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
